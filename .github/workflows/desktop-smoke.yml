name: Desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - src/**
      - ui/**
      - skills/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/lib/**
      - .github/workflows/desktop-*.yml
      - .github/workflows/release.yml
      - .github/workflows/release-retry.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  static-checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile desktop shell
        run: pnpm --filter pilotdeck-desktop run compile

      - name: Test desktop packaging helpers
        run: pnpm --filter pilotdeck-desktop run test

      - name: Test desktop updater network
        # Requires electron-updater, intentionally absent from the Web-only job.
        run: pnpm --dir ui exec vitest run server/services/desktopUpdateNetwork.test.ts server/services/desktopUpdates.spec.ts server/services/desktopAutoUpdate.test.ts

  # PRs exercise the same native packages and updater feeds as releases.
  linux:
    name: Linux
    uses: ./.github/workflows/desktop-linux.yml

  macos:
    name: macOS
    uses: ./.github/workflows/desktop-macos.yml

  windows:
    name: Windows
    uses: ./.github/workflows/desktop-windows.yml

  # PR Desktop only. Must not live in desktop-linux.yml (Daily Release / desktop-build).
  wayland-file-gate:
    name: Wayland File-click C gate arm64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    env:
      PILOTDECK_WAYLAND_DIAG_GROUP: C
      PILOTDECK_WAYLAND_DIAG_GPU: default
      PILOTDECK_WAYLAND_DIAG_N: "300"
      PILOTDECK_WAYLAND_DIAG_EARLY_STOP: "1"
      PILOTDECK_WAYLAND_DIAG_PRE_BYTES: "131072"
      PILOTDECK_WAYLAND_DIAG_POST_MS: "15000"
      PILOTDECK_WAYLAND_DIAG_OK_KEEP: "3"
      NODE_OPTIONS: --max-old-space-size=2560
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile desktop shell
        run: pnpm --filter pilotdeck-desktop run compile
      - name: Install headless Wayland tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dbus-x11 weston
      - name: Wayland File-click C N=300
        run: bash apps/desktop/scripts/run-linux-wayland-diag.sh
      - name: Upload Wayland File-click gate dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pilotdeck-linux-wayland-file-gate-arm64-C
          path: |
            outputs/desktop-chrome-review/linux-wayland-diag-C/linux-wayland-diag-*.json
            outputs/desktop-chrome-review/linux-wayland-diag-C/linux-wayland-diag-*.png
            outputs/desktop-chrome-review/linux-wayland-diag-C/linux-wayland-diag-*.log
            outputs/desktop-chrome-review/linux-wayland-diag-C/linux-wayland-diag-*.log.live
            outputs/desktop-chrome-review/linux-wayland-diag-C/weston-live.log
            outputs/desktop-chrome-review/linux-wayland-diag-C/weston-launch.txt
          if-no-files-found: ignore
          retention-days: 14

  x11-file-gate:
    name: X11 File-click C gate arm64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      PILOTDECK_WAYLAND_DIAG_GROUP: C
      PILOTDECK_WAYLAND_DIAG_GPU: default
      PILOTDECK_WAYLAND_DIAG_N: "100"
      PILOTDECK_WAYLAND_DIAG_EARLY_STOP: "1"
      PILOTDECK_WAYLAND_DIAG_OK_KEEP: "3"
      NODE_OPTIONS: --max-old-space-size=2560
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile desktop shell
        run: pnpm --filter pilotdeck-desktop run compile
      - name: Install headless X11 tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dbus-x11 xvfb xauth
      - name: X11 File-click C N=100
        run: bash apps/desktop/scripts/run-linux-x11-diag.sh
      - name: Upload X11 File-click gate dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pilotdeck-linux-x11-file-gate-arm64-C
          path: |
            outputs/desktop-chrome-review/linux-x11-diag-C/linux-x11-diag-*.json
            outputs/desktop-chrome-review/linux-x11-diag-C/linux-x11-diag-*.png
            outputs/desktop-chrome-review/linux-x11-diag-C/x11-launch.txt
          if-no-files-found: ignore
          retention-days: 14
