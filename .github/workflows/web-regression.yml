name: Web Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install Web/Gateway dependencies only
        run: pnpm install --frozen-lockfile --filter pilotdeck --filter pilotdeck-ui

      - name: Build Gateway and Web UI
        run: pnpm run build:web

      - name: Test Web UI node:test files
        # These suites import node:test. Vitest/Vite cannot bundle that builtin,
        # so they are excluded from the Vitest step and run here with Node.
        # The file set is the same list as ui/vite.config.js test.exclude
        # (scripts/lib/web-node-test-files.mjs). The check fails if they drift.
        run: |
          node scripts/check-web-node-test-scan.mjs
          files="$(node scripts/check-web-node-test-scan.mjs --print)"
          echo "Running node --test on ${files//$'\n'/ }"
          printf '%s\n' "$files"
          mapfile -t file_list <<< "$files"
          if [ "${#file_list[@]}" -lt 8 ]; then
            echo "expected at least 8 ui node:test files, found ${#file_list[@]}"
            exit 1
          fi
          (cd ui && node --test "${file_list[@]}")

      - name: Test Web UI and server
        # The upstream suite currently lets Vitest collect a Playwright E2E file,
        # and streamSmoother's fake-timer spec is independently flaky. Keep the
        # rest of the Web suite as the merge gate until those baseline tests are
        # repaired in their own change.
        # Desktop Smoke runs both updater suites with desktop dependencies.
        run: >-
          pnpm --dir ui exec vitest run
          --exclude 'e2e/**'
          --exclude 'src/components/chat/hooks/streamSmoother.test.ts'
          --exclude 'server/services/desktopUpdateNetwork.test.ts'
          --exclude 'server/services/desktopUpdates.spec.ts'

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pilotdeck:web-regression
